<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova tarefa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #1f2937;
        }
        .card {
            max-width: 560px;
            margin: 60px auto;
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }
        form {
            display: grid;
            gap: 16px;
        }
        form p {
            margin: 0;
            display: grid;
            gap: 8px;
        }
        label {
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            border: none;
            background: #111827;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nova tarefa</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar</button>
        </form>
    </div>
</body>
</html>
