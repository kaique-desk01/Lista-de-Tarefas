<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar Tarefa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #1f2937;
        }
        .box {
            max-width: 560px;
            margin: 60px auto;
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        button {
            border: none;
            background: #111827;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        label {
            font-weight: 600;
        }
        form {
            display: grid;
            gap: 16px;
        }
        form p {
            margin: 0;
            display: grid;
            gap: 8px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }
        .empty {
            text-align: center;
            color: #6b7280;
            padding: 24px;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #111827;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h1>
                Pesquisar
            </h1>
            <a href="{% url 'tasks:tasks-home' %}" class="btn">Voltar</a>
        </div>
        <form method="get">
            <input
                type="search"
                name="q"
                value="{{ termo }}"
                placeholder="Pesquisar"
            >
            <button type="submit">Buscar</button>
        </form>

        {% if termo %}
            <h2>Resultados para: "{{ termo }}"</h2>

            {% for tarefa in resultados %}
                <article>
                    <h3>{{ tarefa.title }}</h3>
                    <p>{{ tarefa.description }}</p>
                </article>
            {% empty %}
                <p class="empty">Nenhuma tarefa foi encontrada.</p>
            {% endfor %}
        {% endif %}
        
    </div>
</body>
</html>
